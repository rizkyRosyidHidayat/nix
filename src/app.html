<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="description" content="Nix is a simple and beautiful todo app" />
		<meta name="keywords" content="todo, nix, todo app, nix todo" />
		<meta name="author" content="Nix" />
		<meta name="theme-color" content="#ffffff" />
		<meta name="msapplication-TileColor" content="#ffffff" />
		<!-- open graph -->
		<meta property="og:title" content="Nix" />
		<meta property="og:description" content="A simple and beautiful todo app" />
		<meta property="og:image" content="/logo.png" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Nix" />
		<meta property="og:url" content="https://hinix.web.id" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:image:width" content="512" />
		<meta property="og:image:height" content="512" />
		<meta property="og:image:type" content="image/png" />
		<!-- twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Nix" />
		<meta name="twitter:description" content="A simple and beautiful todo app" />
		<meta name="twitter:image" content="/logo.png" />
		<meta property="twitter:image:width" content="512" />
		<meta property="twitter:image:height" content="512" />
		<meta property="twitter:image:type" content="image/png" />
		<!-- apple touch icon -->
		<link rel="apple-touch-icon" href="/logo.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
